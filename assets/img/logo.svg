<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ikona aplikace Nazkoušeno.
       Motiv: stránka scénáře, kde jedna replika je tvoje.
       Je to celý produkt v jednom obrázku a při 40 px to pořád čte.
       Barvy jsou z motivu aplikace: teplá čerň hlediště a mosaz. -->
  <rect width="1024" height="1024" fill="#12100E"/>
  <!-- Dvě masky přes sebe: zadní obrysem, přední plná. Překryv se tím
       vyřeší sám — kde přední leží na zadní, obrys zmizí. -->
  <g transform="translate(599.0,204.8) rotate(9.17)">
    <path d="M-125.4,-55.3 C-120.4,-141.3 -50.2,-159.7 0,-153.6 C50.2,-159.7 120.4,-141.3 125.4,-55.3 C120.4,55.3 65.2,135.2 0,153.6 C-65.2,135.2 -120.4,55.3 -125.4,-55.3 Z" fill="none" stroke="#6B5B3E" stroke-width="20.5"/>
    <path d="M-90.3,-30.7 Q-52.7,9.2 -15.1,-30.7 Q-52.7,-17.1 -90.3,-30.7 Z" fill="#6B5B3E"/>
    <path d="M15.1,-30.7 Q52.7,9.2 90.3,-30.7 Q52.7,-17.1 15.1,-30.7 Z" fill="#6B5B3E"/>
    <path d="M-52.7,67.6 Q0.0,15.4 52.7,67.6 Q0.0,49.8 -52.7,67.6 Z" fill="#6B5B3E"/>
  </g>
  <g transform="translate(435.2,250.9) rotate(-8.02)">
    <path d="M-125.4,-55.3 C-120.4,-141.3 -50.2,-159.7 0,-153.6 C50.2,-159.7 120.4,-141.3 125.4,-55.3 C120.4,55.3 65.2,135.2 0,153.6 C-65.2,135.2 -120.4,55.3 -125.4,-55.3 Z M-90.3,-30.7 Q-52.7,-70.7 -15.1,-30.7 Q-52.7,-44.3 -90.3,-30.7 Z M15.1,-30.7 Q52.7,-70.7 90.3,-30.7 Q52.7,-44.3 15.1,-30.7 Z M-52.7,67.6 Q0.0,119.8 52.7,67.6 Q0.0,85.3 -52.7,67.6 Z" fill="#E0B45E" fill-rule="evenodd"/>
  </g>
  <g stroke="#6B5B3E" stroke-width="34" stroke-linecap="round">
    <line x1="270" y1="471" x2="754" y2="471"/>
    <line x1="270" y1="778" x2="754" y2="778"/>
  </g>
  <!-- Moje replika: mosazný praporek a plný tah, stejně jako ve čtečce. -->
  <rect x="212" y="591" width="42" height="68" fill="#E0B45E"/>
  <line x1="306" y1="625" x2="812" y2="625"
        stroke="#E0B45E" stroke-width="52" stroke-linecap="round"/>
</svg>
